<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог музыкальных альбомов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎵 Каталог музыкальных альбомов</h1>
    </header>

    <main>
        <div class="controls">
            <select id="sort-select">
                <option value="default">Без сортировки</option>
                <option value="year">По году (сначала новые)</option>
                <option value="artist">По исполнителю (А-Я)</option>
            </select>
        </div>

        <div class="layout">
            <section id="albums-section" class="albums-list">
            </section>

            <section class="add-section">
                <h2>Добавить альбом</h2>
                <form id="album-form">
                    <input type="text" id="artist" placeholder="Исполнитель" required>
                    <input type="text" id="title" placeholder="Название альбома" required>
                    <input type="number" id="year" placeholder="Год выпуска" min="1900" max="2026" required>
                    <input type="text" id="genre" placeholder="Жанр" required>
                    
                    <h3>Треки (необязательно)</h3>
                    <div id="temp-tracks-list" class="temp-tracks"></div>
                    <div class="track-form">
                        <input type="text" id="track-name" placeholder="Название трека">
                        <input type="text" id="track-duration" placeholder="Мин:Сек (3:45)">
                        <button type="button" id="add-track-btn">+ Трек</button>
                    </div>
                    
                    <button type="submit" class="submit-btn">Сохранить альбом</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Плеер внизу экрана -->
    <div id="player-container" style="display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0f19; padding: 15px; box-sizing: border-box; border-top: 2px solid #6a5acd; z-index: 9999; text-align: center;">
        <div style="max-width: 600px; margin: 0 auto;">
            <div id="current-track-title" style="color: #00d4ff; margin-bottom: 10px; font-weight: bold;">Выберите трек</div>
            <audio id="audio-player" controls style="width: 100%; outline: none;"></audio>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

    <script src="script.js"></script>
</body>
</html>
